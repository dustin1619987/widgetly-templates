# Collects public-domain wallpapers (scripts/pd_wallpapers.py) and commits them.
name: Public domain wallpapers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/pd_wallpapers.py]
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - run: python scripts/pd_wallpapers.py
      - name: Commit the wallpapers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wallpapers wallpapers.json
          git diff --cached --quiet || git commit -m "Public domain wallpapers"
          git push
