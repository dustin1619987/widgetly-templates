# Finds photo candidates for the photo themes and downloads the picked ones (scripts/theme_photos.py).
# Candidates go to the theme-candidates branch; picked photos to main.
name: Theme photos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/theme_photos.py, scripts/theme_picks.json]
permissions:
  contents: write
concurrency: theme-photos
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests "opencv-python-headless<5" numpy
      - name: Bring back earlier candidates
        run: |
          git fetch origin theme-candidates && git checkout origin/theme-candidates -- candidates && git reset -q candidates || true
      - run: python scripts/theme_photos.py
      - name: Commit picked photos to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add themes
          git diff --cached --quiet || { git commit -m "Photo theme wallpapers" && git push origin HEAD:main; }
      - name: Save candidates
        run: |
          git checkout --orphan theme-candidates-new
          git rm -rq --cached . 
          git add -f candidates
          git commit -qm "Theme photo candidates"
          git push -f origin theme-candidates-new:theme-candidates
