<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Widgetly theme for you</title>
<meta name="description" content="Someone shared a home screen theme made in Widgetly. Open it in the app to set it up.">
<meta property="og:title" content="A Widgetly theme for you">
<meta property="og:description" content="Tap to open this home screen theme in Widgetly.">
<style>
  :root { color-scheme: light dark; --bg: #f4f5fb; --card: #ffffff; --ink: #14162b; --muted: #5b5f7a; --accent: #3b5bdb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d0f1c; --card: #171a2e; --ink: #f2f3fa; --muted: #a3a7c4; --accent: #7c9cff; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 420px; background: var(--card); border-radius: 28px; padding: 28px 24px; text-align: center;
         box-shadow: 0 10px 40px rgba(20, 22, 43, 0.12); }
  .swatches { display: flex; justify-content: center; gap: 10px; margin: 6px 0 18px; }
  .swatches span { width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(127, 127, 127, 0.25); }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 22px; }
  a.button { display: block; padding: 14px 18px; border-radius: 16px; font-weight: 600; text-decoration: none; margin-top: 10px; }
  .primary { background: var(--accent); color: #fff; }
  .secondary { color: var(--accent); border: 1.5px solid var(--accent); }
  small { display: block; color: var(--muted); margin-top: 18px; }
</style>
</head>
<body>
<main>
  <div class="swatches" id="swatches" aria-hidden="true"></div>
  <h1 id="title">A Widgetly theme for you</h1>
  <p>Someone shared a home screen theme with you: wallpaper, widgets and app icons that match.</p>
  <a class="button primary" id="open" href="#">Open in Widgetly</a>
  <a class="button secondary" id="get" href="https://play.google.com/store/apps/details?id=com.widgetly.app">Get Widgetly on Google Play</a>
  <small>Widgetly is for Android. If the app doesn't open, install it, then tap this link again.</small>
</main>
<script>
  (function () {
    var query = location.search.replace(/^\?/, "");
    var params = new URLSearchParams(query);
    var name = params.get("p") || params.get("n");
    if (name) document.getElementById("title").textContent = name.slice(0, 40);
    var colors = (params.get("c") || "").split("-").filter(function (c) { return /^[0-9a-fA-F]{6}$/.test(c); });
    var box = document.getElementById("swatches");
    colors.slice(0, 4).forEach(function (c) {
      var dot = document.createElement("span");
      dot.style.background = "#" + c;
      box.appendChild(dot);
    });
    var store = "https://play.google.com/store/apps/details?id=com.widgetly.app";
    var open = document.getElementById("open");
    // Android opens the app, or Google Play when it isn't installed.
    open.href = "intent://look?" + query + "#Intent;scheme=widgetly;package=com.widgetly.app;S.browser_fallback_url=" +
      encodeURIComponent(store) + ";end";
  })();
</script>
</body>
</html>
